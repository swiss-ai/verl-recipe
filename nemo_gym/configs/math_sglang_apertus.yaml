# swiss-ai smoke: math env + token-exact SGLang model server (NVIDIA-NeMo/gym#1787)
# against verl's native SGLang rollout engines. See NOTES-SWISSAI.md.
nemo_gym:
  nemo_gym_root: $NEMO_GYM_ROOT
  uses_reasoning_parser: false
  model_server: sglang_model
  policy_model_overrides:
    context_length: 4096
    uses_reasoning_parser: false
  config_paths:
    - $NEMO_GYM_ROOT/responses_api_models/sglang_model/configs/sglang_model_for_training.yaml
    - $NEMO_GYM_ROOT/resources_servers/math_with_judge/configs/math_with_judge.yaml
