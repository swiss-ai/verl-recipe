# Interactive SWE-env training: workspace_swe served REMOTELY from breithorn
# k8s (which in turn delegates execution to the code-gym-sandbox). The
# gymnasium_agent runs locally by the policy and drives the multi-turn
# clone/edit/run/submit loop; commands + rewards round-trip
# Clariden -> https://gym-dev.swissai.svc.cscs.ch/workspace_swe -> sandbox.
nemo_gym:
  nemo_gym_root: $NEMO_GYM_ROOT
  uses_reasoning_parser: false
  model_server: sglang_model
  policy_model_overrides:
    context_length: 8192   # SWE turns carry file listings + command output
    uses_reasoning_parser: false
  config_paths:
    - $NEMO_GYM_ROOT/responses_api_models/sglang_model/configs/sglang_model_for_training.yaml
    - $NEMO_GYM_ROOT/resources_servers/workspace_swe/configs/workspace_swe_remote.yaml
